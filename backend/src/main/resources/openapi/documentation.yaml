openapi: 3.0.3
info:
  title: SNK Conferência - API REST Ktor
  description: API REST em Kotlin/Ktor para autenticação, consultas de expedição, separação e conferência de mercadorias integrada ao ERP Sankhya.
  version: 1.0.0
servers:
  - url: /
    description: Servidor Atual (Relativo)

security:
  - BearerAuth: []

paths:
  # ==========================================
  # AUTENTICAÇÃO
  # ==========================================
  /api/v1/auth/login:
    post:
      security: []
      tags:
        - Autenticação
      summary: Efetuar Login no ERP Sankhya
      description: Valida as credenciais informadas contra o serviço MobileLoginSP.login do Sankhya no servidor selecionado e retorna um token JWT de sessão.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentialsDto'
      responses:
        '200':
          description: Autenticação realizada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponseDto'
        '400':
          description: Requisição ou credenciais inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: Autenticação recusada pelo ERP Sankhya.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

  /api/v1/auth/verify:
    get:
      tags:
        - Autenticação
      summary: Validar Token de Sessão JWT
      description: Revalida a integridade e expiração do token JWT informado no cabeçalho Authorization.
      operationId: verifySession
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Sessão válida e ativa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSessionDto'
        '401':
          description: Token inválido, expirado ou ausente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

  /api/v1/auth/logout:
    post:
      tags:
        - Autenticação
      summary: Encerrar Sessão do Usuário
      description: Invalida a sessão ativa do usuário no backend.
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Sessão encerrada com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Sessão encerrada com sucesso.

  # ==========================================
  # LOOKUPS / AUTOCOMPLETAR
  # ==========================================
  /api/v1/empresas:
    get:
      tags:
        - Lookups
      summary: Listar Empresas Ativas
      description: Retorna a lista de empresas ativas cadastradas no ERP Sankhya.
      operationId: buscarEmpresas
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lista de empresas retornada com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmpresaResponse'
        '401':
          description: Sessão não informada ou token inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

  /api/v1/parceiros:
    get:
      tags:
        - Lookups
      summary: Autocompletar / Buscar Parceiros
      description: Busca parceiros de negócio por código ou razão social/nome fantasia.
      operationId: buscarParceiros
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          description: Código do parceiro ou termo para busca parcial por nome.
          required: false
          schema:
            type: string
            example: "STOKY"
      responses:
        '200':
          description: Lista de parceiros encontrados (máximo 50 registros).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParceiroResponse'
        '401':
          description: Sessão não informada ou token inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

  /api/v1/produtos:
    get:
      tags:
        - Lookups
      summary: Autocompletar / Buscar Produtos
      description: Busca produtos por código numérico ou descrição/marca/referência.
      operationId: buscarProdutos
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          description: Código do produto ou termo para busca parcial por descrição.
          required: false
          schema:
            type: string
            example: "PARAFUSO"
      responses:
        '200':
          description: Lista de produtos encontrados (máximo 50 registros).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProdutoResponse'
        '401':
          description: Sessão não informada ou token inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

  # ==========================================
  # SEPARAÇÃO DE MERCADORIAS
  # ==========================================
  /api/v1/separacoes/search:
    post:
      tags:
        - Separação
      summary: Consultar Tarefas de Separação por Filtros
      description: Realiza busca combinada de tarefas de separação na View APP_SEPARACAO. Exige pelo menos 1 filtro preenchido.
      operationId: buscarSeparacoes
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeparacaoFilterRequest'
      responses:
        '200':
          description: Separações encontradas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeparacaoResponse'
        '400':
          description: Nenhum filtro informado ou parâmetros inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: Sessão não informada ou token inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

  /api/v1/separacoes/{nroSeparacao}/itens:
    get:
      tags:
        - Separação
      summary: Detalhar Itens de uma Separação
      description: Retorna os produtos e itens associados a uma tarefa de separação específica.
      operationId: buscarItensSeparacao
      security:
        - BearerAuth: []
      parameters:
        - name: nroSeparacao
          in: path
          required: true
          description: Número da separação
          schema:
            type: integer
            format: int64
            example: 1001
      responses:
        '200':
          description: Itens da separação retornados com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemSeparacaoResponse'
        '400':
          description: Número de separação inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: Sessão não informada ou token inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

  /api/v1/separacoes/{nroSeparacao}/volumes/quantidade:
    get:
      tags:
        - Separação
      summary: Obter Quantidade de Volumes da Separação
      description: Retorna a quantidade de volumes/etiquetas registradas na tabela TGWREV para a separação.
      operationId: obterQuantidadeVolumes
      security:
        - BearerAuth: []
      parameters:
        - name: nroSeparacao
          in: path
          required: true
          description: Número da separação
          schema:
            type: integer
            format: int64
            example: 1001
      responses:
        '200':
          description: Quantidade de volumes consultada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuantidadeVolumesResponse'
        '400':
          description: Número de separação inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: Sessão não informada ou token inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

  /api/v1/separacoes/{nroSeparacao}/volumes:
    post:
      tags:
        - Separação
      summary: Gerar Etiquetas de Volume
      description: Dispara o procedimento MgeWmsSP.gerarEtiquetasVolume para criar os volumes da separação no ERP Sankhya.
      operationId: gerarVolumes
      security:
        - BearerAuth: []
      parameters:
        - name: nroSeparacao
          in: path
          required: true
          description: Número da separação
          schema:
            type: integer
            format: int64
            example: 1001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GerarVolumesRequest'
      responses:
        '201':
          description: Volumes gerados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GerarVolumesResponse'
        '400':
          description: Quantidade inválida ou erro no processamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: Sessão não informada ou token inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

  # ==========================================
  # CONFERÊNCIA E EXPEDIÇÃO
  # ==========================================
  /api/v1/conferencia/search:
    post:
      tags:
        - Conferência
      summary: Buscar / Consultar Conferências
      description: Consulta a View APP_SEPARACAO filtrando por checkout ou por número da conferência.
      operationId: buscarConferencia
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuscarConferenciaRequest'
      responses:
        '200':
          description: Conferências encontradas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConferenciaResponse'
        '400':
          description: Parâmetros de busca inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: Sessão não informada ou token inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

  /api/v1/conferencia/iniciar:
    post:
      tags:
        - Conferência
      summary: Iniciar Conferência por Checkout
      description: Inicia o processo de conferência no WMS via MgeWmsSP.buscaConferenciaPorPedido para o endereço de checkout.
      operationId: iniciarConferencia
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IniciarConferenciaRequest'
      responses:
        '200':
          description: Conferência iniciada com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IniciarConferenciaResponse'
        '400':
          description: Checkout inválido ou checkout ocupado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: Sessão não informada ou token inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

  /api/v1/conferencia/pendentes:
    get:
      tags:
        - Conferência
      summary: Buscar Tarefas Pendentes do Conferente
      description: Retorna as tarefas em andamento associadas ao conferente ativo.
      operationId: buscarTarefasPendentes
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lista de tarefas pendentes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConferenciaPendenteResponse'
        '401':
          description: Sessão não informada ou token inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

  /api/v1/conferencia/itens:
    post:
      tags:
        - Conferência
      summary: Buscar Itens da Conferência
      description: Lista os produtos a conferir na View APP_CONFERENCIA_ITENS.
      operationId: buscarItensConferencia
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuscarItensConferenciaRequest'
      responses:
        '200':
          description: Itens da conferência consultados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemConferenciaResponse'
        '400':
          description: Número de conferência inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: Sessão não informada ou token inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

  /api/v1/conferencia/info:
    post:
      tags:
        - Conferência
      summary: Obter Informações do Produto bipado
      description: Retorna descrição e complementos do produto via MgeWmsSP.buscaInfoProduto.
      operationId: obterInfoProduto
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InfoProdutoRequest'
      responses:
        '200':
          description: Detalhes do produto retornados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoProdutoResponse'
        '400':
          description: Código de barras ou conferência inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: Sessão não informada ou token inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

  /api/v1/conferencia/registrar:
    post:
      tags:
        - Conferência
      summary: Registrar Bipagem de Item
      description: Registra a quantidade bipada do produto via MgeWmsSP.insereItemConferidoColetor.
      operationId: registrarItemConferido
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarItemConferidoRequest'
      responses:
        '200':
          description: Item registrado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrarItemResponse'
        '400':
          description: Produto incorreto, quantidade excedida ou erro de bipagem.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: Sessão não informada ou token inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

  /api/v1/conferencia/itens/saldo:
    post:
      tags:
        - Conferência
      summary: Atualizar Saldo do Item Conferido
      description: Consulta saldo conferido e sequências ativas em APP_CONFERENCIA_ITENS_SALDO.
      operationId: atualizarSaldoItem
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarSaldoRequest'
      responses:
        '200':
          description: Saldo do item atualizado com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SaldoItemResponse'
        '400':
          description: Número de conferência inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: Sessão não informada ou token inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

  /api/v1/conferencia/remover-itens:
    post:
      tags:
        - Conferência
      summary: Remover Itens / Recontar
      description: Limpa sequências conferidas no coletor via MgeWmsSP.removeItensConferidosColetor.
      operationId: removerItens
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoverItensRequest'
      responses:
        '200':
          description: Itens removidos com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConferenciaActionResponse'
        '400':
          description: Erro ao remover itens da conferência.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: Sessão não informada ou token inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

  /api/v1/conferencia/finalizar:
    post:
      tags:
        - Conferência
      summary: Finalizar Conferência
      description: Encerra o processo de conferência via MgeWmsSP.produtosConferidos e valida se há divergências.
      operationId: finalizarConferencia
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizarConferenciaRequest'
      responses:
        '200':
          description: Conferência finalizada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizarConferenciaResponse'
        '400':
          description: Divergência encontrada ou erro de encerramento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: Sessão não informada ou token inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

  /api/v1/conferencia/volumes:
    post:
      tags:
        - Conferência
      summary: Registrar Volumes da Conferência
      description: Registra a quantidade de volumes via MgeWmsSP.registraEtiquetasVolume.
      operationId: registrarVolumes
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarVolumesRequest'
      responses:
        '200':
          description: Volumes registrados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConferenciaActionResponse'
        '400':
          description: Quantidade ou conferência inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: Sessão não informada ou token inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

  /api/v1/conferencia/doca:
    post:
      tags:
        - Conferência
      summary: Enviar Conferência para a Doca
      description: Direciona a conferência/separação para a doca de expedição via MgeWmsSP.liberaCheckoutDoca.
      operationId: enviarParaDoca
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnviarDocaRequest'
      responses:
        '200':
          description: Envio para a doca realizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConferenciaActionResponse'
        '400':
          description: Parâmetros de conferência inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: Sessão não informada ou token inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

  /api/v1/conferencia/cancelar:
    post:
      tags:
        - Conferência
      summary: Cancelar Conferência
      description: Cancela a conferência ativa da separação no ERP via MgeWmsSP.cancelaTarefa.
      operationId: cancelarConferencia
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelarConferenciaRequest'
      responses:
        '200':
          description: Conferência cancelada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConferenciaActionResponse'
        '400':
          description: Número de conferência inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: Sessão não informada ou token inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

  /api/v1/conferencia/volumes/imprimir:
    post:
      tags:
        - Conferência
      summary: Solicitar Impressão de Etiquetas de Volumes
      description: Gera o documento HTML formatado com os cartões e códigos de barras das etiquetas de volume gravadas na tabela TGWREV.
      operationId: imprimirVolumes
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImprimirVolumesRequest'
      responses:
        '200':
          description: Documento HTML com etiquetas de volume gerado com sucesso.
          content:
            text/html:
              schema:
                type: string
                example: "<!DOCTYPE html><html><body>Etiquetas</body></html>"
        '400':
          description: Número único ou número de separação inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: Sessão não informada ou token inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT retornado no endpoint de login.

  schemas:
    AuthCredentialsDto:
      type: object
      required:
        - username
        - password
        - server
      properties:
        username:
          type: string
          example: alisson
        password:
          type: string
          format: password
          example: "******"
        server:
          type: string
          enum: [producao, treinamento]
          example: producao

    TokenResponseDto:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          example: 86400
        user:
          $ref: '#/components/schemas/UserSessionDto'

    UserSessionDto:
      type: object
      properties:
        idusu:
          type: string
          example: "123"
        username:
          type: string
          example: alisson
        jsessionid:
          type: string
          example: 994ABF4357D...
        server:
          type: string
          example: producao

    ErrorResponseDto:
      type: object
      properties:
        title:
          type: string
          example: Requisição Inválida
        message:
          type: string
          example: Informe pelo menos um filtro para buscar as separações.
        status:
          type: integer
          example: 400

    EmpresaResponse:
      type: object
      properties:
        codEmp:
          type: integer
          format: int64
          example: 1
        nomeEmp:
          type: string
          example: STOKY DISTRIBUIDORA LTDA
        razamSoc:
          type: string
          example: STOKY DISTRIBUIDORA LTDA

    ParceiroResponse:
      type: object
      properties:
        codParc:
          type: integer
          format: int64
