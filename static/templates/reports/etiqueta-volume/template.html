<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Etiquetas de Volume - Pedido {{nroNota}}</title>
    <style>
        @page {
            size: 100mm 60mm;
            margin: 0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            width: 100mm;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #000;
            background-color: #fff;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        .label-card {
            width: 100mm;
            height: 60mm;
            padding: 2mm 3mm;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-color: #fff;
            page-break-after: always;
        }
        .label-card:last-child {
            page-break-after: avoid;
        }
        
        .border-line {
            height: 1.5px;
            background-color: #000;
            width: 100%;
        }
        
        /* Row 1: Header */
        .header-row {
            display: flex;
            height: 9mm;
            align-items: center;
        }
        .logo-box {
            width: 35%;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -1.5px;
            line-height: 1;
            display: flex;
            align-items: center;
        }
        .header-divider {
            width: 1.5px;
            align-self: stretch;
            background-color: #000;
        }
        .pedido-box {
            width: 35%;
            padding-left: 2mm;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .pedido-title {
            font-size: 14px;
            font-weight: bold;
        }
        .pedido-val {
            font-size: 14px;
            font-weight: 900;
        }
        .oc-val {
            font-size: 12px;
            font-weight: bold;
            margin-top: 1px;
        }
        .info-box {
            width: 30%;
            padding-left: 2mm;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .info-date {
            font-size: 8px;
            font-weight: bold;
            white-space: nowrap;
        }
        .info-user {
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }
        
        /* Row 2: Client Code - Name */
        .client-row {
            height: 8mm;
            display: flex;
            align-items: center;
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* Row 3: Logistics details */
        .logistics-row {
            height: 9mm;
            display: flex;
            align-items: stretch;
        }
        .city-box {
            width: 60%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-right: 1mm;
        }
        .logistics-title {
            font-size: 8px;
            font-weight: bold;
            color: #000;
            text-transform: uppercase;
        }
        .city-val {
            font-size: 15px;
            font-weight: 900;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .volume-box {
            width: 20%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .volume-val {
            font-size: 18px;
            font-weight: 900;
            line-height: 1;
            margin-top: 1px;
        }
        .entrega-box {
            width: 20%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .entrega-val {
            font-size: 18px;
            font-weight: 900;
            line-height: 1;
            margin-top: 1px;
            text-transform: uppercase;
        }

        /* Row 4: Address Details */
        .address-row {
            height: 11mm;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-size: 8.5px;
            line-height: 1.2;
            overflow: hidden;
        }
        .razao-val {
            font-weight: bold;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .address-val {
            font-weight: normal;
            text-transform: uppercase;
            word-break: break-all;
        }

        /* Row 5: Barcode footer */
        .barcode-row {
            height: 11mm;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .barcode-svg-container {
            width: 60%;
            height: 100%;
            display: flex;
            align-items: center;
        }
        .barcode-svg {
            width: 100%;
            height: 100%;
        }
        .barcode-text {
            width: 40%;
            font-size: 28px;
            font-weight: 900;
            text-align: right;
            line-height: 1;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    {{content}}

    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <script>
        window.onload = function() {
            const barcodes = {{barcodes}};
            barcodes.forEach(id => {
                try {
                    JsBarcode("#barcode-" + id, id, {
                        format: "CODE128",
                        displayValue: false,
                        height: 40,
                        width: 2.2,
                        margin: 0
                    });
                } catch (err) {
                    console.error("Erro ao gerar barcode para " + id, err);
                }
            });
            
            setTimeout(() => {
                window.print();
            }, 300);
        };
    </script>
</body>
</html>
